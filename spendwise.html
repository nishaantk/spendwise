<style>
/* ---------- design tokens ---------- */
:root {
  --bg: #08080a;
  --surface: rgba(20, 20, 26, 0.66);
  --surface-solid: #121216;
  --surface-2: rgba(255, 255, 255, 0.045);
  --surface-3: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.075);
  --border-strong: rgba(255, 255, 255, 0.14);
  --text: #f4f4f5;
  --text-muted: #8a8a99;
  --text-dim: #5f5f6d;
  --accent: #8b5cf6;
  --accent-hover: #7c3aed;
  --accent-soft: rgba(139, 92, 246, 0.12);
  --accent-line: rgba(139, 92, 246, 0.35);
  --success: #34d399;
  --danger: #f87171;
  --warn: #fbbf24;
  --r-card: 16px;
  --r-input: 10px;
  --rail: 232px;
  --blur: 20px;
  --hairline: inset 0 1px 0 rgba(255, 255, 255, 0.055);
  --lift: 0 24px 48px -28px rgba(0, 0, 0, 0.9);
}

* { box-sizing: border-box; }

html, body, #root { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01";
}

/* ambient purple light behind the glass */
body::before,
body::after {
  content: "";
  position: fixed;
  pointer-events: none;
  z-index: 0;
  filter: blur(10px);
}
body::before {
  width: 900px;
  height: 700px;
  top: -320px;
  left: -180px;
  background: radial-gradient(closest-side, rgba(139, 92, 246, 0.34), transparent 70%);
}
body::after {
  width: 760px;
  height: 620px;
  right: -220px;
  bottom: -280px;
  background: radial-gradient(closest-side, rgba(124, 58, 237, 0.3), transparent 72%);
}
#root, .shell, .auth { position: relative; z-index: 1; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.shell { display: flex; min-height: 100%; }

.rail {
  width: var(--rail);
  flex: 0 0 var(--rail);
  border-right: 1px solid var(--border);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: sticky;
  top: 0;
  height: 100vh;
  background: rgba(9, 9, 12, 0.55);
  backdrop-filter: blur(var(--blur)) saturate(130%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(130%);
  box-shadow: var(--hairline);
}

.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; }
.brand-mark {
  width: 30px; height: 30px; flex: 0 0 30px;
  display: grid; place-items: center;
  filter: drop-shadow(0 8px 16px rgba(139, 92, 246, 0.35));
}
.brand-mark svg { width: 100%; height: 100%; display: block; }
.brand-mark.lg { width: 44px; height: 44px; flex-basis: 44px; }
.brand-name { font-weight: 650; letter-spacing: -0.01em; }
.brand-sub { color: var(--text-dim); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 10px;
  color: var(--text-muted); background: none; border: 1px solid transparent;
  text-align: left; width: 100%; font-weight: 500;
  transition: background 140ms ease-out, color 140ms ease-out;
}
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--text); border-color: var(--accent-line); }
.nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.5; }
.nav-item.active .dot { background: var(--accent); opacity: 1; }
.rail-foot { margin-top: auto; display: grid; gap: 10px; }
.rail-user { padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.rail-user .who { font-weight: 600; font-size: 13px; }
.rail-user .mail { color: var(--text-dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }

.main { flex: 1; min-width: 0; }
.page { max-width: 1080px; margin: 0 auto; padding: 32px 28px 96px; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-title { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
.page-sub { color: var(--text-muted); font-size: 13px; margin: 4px 0 0; }
.eyebrow { color: var(--text-dim); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }

/* ---------- cards ---------- */
.card {
  background: linear-gradient(158deg, rgba(32, 30, 44, 0.62), rgba(15, 15, 20, 0.55));
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  padding: 20px;
  backdrop-filter: blur(var(--blur)) saturate(125%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(125%);
  box-shadow: var(--hairline), var(--lift);
}
.card.tight { padding: 16px; }
.card.plain { background: rgba(255, 255, 255, 0.022); }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
.card-title { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.card-note { color: var(--text-dim); font-size: 12px; }

/* hero */
.hero {
  position: relative; overflow: hidden; padding: 26px 24px;
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(139, 92, 246, 0.18), transparent 55%),
    linear-gradient(158deg, rgba(38, 32, 56, 0.72), rgba(17, 17, 22, 0.6));
  border-color: rgba(139, 92, 246, 0.22);
}
.hero::before {
  content: ""; position: absolute; inset: -50% 35% auto -12%; height: 300px;
  background: radial-gradient(closest-side, rgba(139, 92, 246, 0.35), transparent 72%);
  pointer-events: none;
}
.hero::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09);
  pointer-events: none;
}
.hero-label { color: var(--text-muted); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
.hero-amount {
  font-size: clamp(34px, 6vw, 46px); font-weight: 680; letter-spacing: -0.03em;
  margin: 8px 0 2px; font-variant-numeric: tabular-nums; line-height: 1.05;
}
.hero-amount.over { color: var(--danger); }
.hero-meta { color: var(--text-muted); font-size: 13px; }
.hero-meta b { color: var(--text); font-weight: 600; }

.bar { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin: 18px 0 10px; }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width 400ms ease-out; }
.bar.warn > span { background: var(--warn); }
.bar.over > span { background: var(--danger); }

.hero-foot { display: flex; gap: 18px; flex-wrap: wrap; color: var(--text-muted); font-size: 12px; }
.hero-foot span b { color: var(--text); }

/* stat tiles */
.grid { display: grid; gap: 14px; }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; }

.stat-label { color: var(--text-muted); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
.stat-value { font-size: 20px; font-weight: 620; letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat-hint { color: var(--text-dim); font-size: 11px; margin-top: 4px; }

/* ---------- buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 14px; border-radius: var(--r-input);
  border: 1px solid var(--border-strong); background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-size: 13px; font-weight: 550; transition: background 140ms ease-out, border-color 140ms ease-out, transform 140ms ease-out;
  min-height: 38px; box-shadow: var(--hairline);
}
.btn:hover { background: rgba(255, 255, 255, 0.09); border-color: rgba(255, 255, 255, 0.2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(180deg, #9b6ff9, #7c3aed);
  border-color: rgba(167, 139, 250, 0.7); color: #0a0a0b; font-weight: 650;
  box-shadow: 0 10px 24px -12px rgba(139, 92, 246, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}
.btn-primary:hover { background: linear-gradient(180deg, #a882ff, #8b5cf6); }
.btn-ghost { background: none; border-color: transparent; color: var(--text-muted); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-danger { color: var(--danger); border-color: rgba(248, 113, 113, 0.3); background: rgba(248, 113, 113, 0.08); }
.btn-danger:hover { background: rgba(248, 113, 113, 0.16); }
.btn-sm { padding: 6px 10px; min-height: 30px; font-size: 12px; }
.btn-icon { width: 30px; height: 30px; padding: 0; }

.field { display: grid; gap: 6px; }
.field label { color: var(--text-muted); font-size: 12px; font-weight: 500; }
.input {
  width: 100%; padding: 10px 12px; border-radius: var(--r-input);
  background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); color: var(--text);
  transition: border-color 140ms ease-out, background 140ms ease-out;
  min-height: 42px;
}
.input::placeholder { color: var(--text-dim); }
.input:hover { border-color: var(--border-strong); }
.input:focus { border-color: rgba(167, 139, 250, 0.8); outline: none; background: rgba(139, 92, 246, 0.08); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2), var(--hairline); }
.input.amount { font-size: 26px; font-weight: 640; letter-spacing: -0.02em; padding: 12px 14px; font-variant-numeric: tabular-nums; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.field-error { color: var(--danger); font-size: 12px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px; border-radius: 99px; border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.04); color: var(--text-muted); font-size: 12.5px; font-weight: 500;
  transition: all 140ms ease-out; backdrop-filter: blur(6px);
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip.on {
  background: rgba(139, 92, 246, 0.18); border-color: rgba(167, 139, 250, 0.55); color: var(--text);
  box-shadow: 0 0 0 1px rgba(139, 92, 246, 0.15), 0 8px 20px -14px rgba(139, 92, 246, 0.9);
}
.tag {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px;
  border-radius: 6px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
  font-size: 11.5px; color: var(--text-muted); white-space: nowrap;
}
.tag.over { color: var(--danger); border-color: rgba(248, 113, 113, 0.3); }

/* ---------- rows / lists ---------- */
.list { display: grid; }
.row {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; align-items: center;
  gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--border);
}
.row:last-child { border-bottom: none; }
.row:hover .row-actions { opacity: 1; }
.row-emoji { width: 30px; height: 30px; border-radius: 9px; background: rgba(255, 255, 255, 0.05); display: grid; place-items: center; font-size: 14px; border: 1px solid var(--border); }
.row-main { min-width: 0; }
.row-title { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { color: var(--text-dim); font-size: 11.5px; }
.row-amount { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 140ms ease-out; }
@media (hover: none) { .row-actions { opacity: 1; } }

.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th { text-align: left; color: var(--text-dim); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 0 10px 10px; border-bottom: 1px solid var(--border); }
table.tbl td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.tbl tr:last-child td { border-bottom: none; }
table.tbl tbody tr:hover td { background: rgba(255, 255, 255, 0.015); }
td.right, th.right { text-align: right; }

.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; color: var(--text-dim); font-size: 12px; }

/* ---------- charts ---------- */
.donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.legend { display: grid; gap: 7px; flex: 1 1 150px; min-width: 150px; }
@media (max-width: 720px) {
  .donut-wrap { flex-direction: column; align-items: stretch; gap: 14px; }
  .donut-wrap > svg { align-self: center; }
  .legend { min-width: 100%; }
  .legend-name { white-space: normal; }
}
.legend-row { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 12px; }
.legend-swatch { width: 8px; height: 8px; border-radius: 2px; }
.legend-name { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend-val { color: var(--text); font-variant-numeric: tabular-nums; }

/* ---------- modal / toast ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(4, 4, 6, 0.55);
  backdrop-filter: blur(10px) saturate(120%); -webkit-backdrop-filter: blur(10px) saturate(120%);
  display: grid; place-items: center; padding: 20px; z-index: 50;
  animation: fade 140ms ease-out;
}
.modal {
  width: min(520px, 100%);
  background: linear-gradient(160deg, rgba(34, 31, 46, 0.88), rgba(15, 15, 20, 0.86));
  backdrop-filter: blur(28px) saturate(135%); -webkit-backdrop-filter: blur(28px) saturate(135%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 40px 80px -40px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  border-radius: 18px; padding: 22px; animation: pop 160ms ease-out;
  max-height: calc(100vh - 40px); overflow-y: auto;
}
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.modal-title { font-size: 16px; font-weight: 620; letter-spacing: -0.01em; margin: 0; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(0.99); } to { opacity: 1; transform: none; } }

.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 60; width: min(420px, calc(100% - 32px)); }
.toast {
  display: flex; align-items: center; gap: 12px; justify-content: space-between;
  background: rgba(28, 26, 38, 0.86); backdrop-filter: blur(20px) saturate(130%);
  border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 12px;
  padding: 11px 14px; font-size: 13px; animation: pop 160ms ease-out;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
.toast.error { border-color: rgba(248, 113, 113, 0.4); }
.toast.warn { border-color: rgba(251, 191, 36, 0.4); }
.toast .act { color: var(--accent); font-weight: 600; background: none; border: none; padding: 4px 6px; }

/* ---------- states ---------- */
.empty { text-align: center; padding: 40px 20px; }
.empty-mark { width: 44px; height: 44px; border-radius: 12px; border: 1px dashed rgba(255, 255, 255, 0.18); display: grid; place-items: center; margin: 0 auto 14px; color: var(--text-dim); }
.empty h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
.empty p { margin: 0 0 16px; color: var(--text-muted); font-size: 13px; }

<body>
<div id="app"></div>
<noscript style="color:#f4f4f5;font-family:system-ui;padding:24px;display:block">
  Spendwise needs JavaScript enabled to run.
</noscript>
<script>
/* ==========================================================================
   Spendwise — standalone build.
   Same domain model as the FastAPI edition: an object-oriented layer
   (entities → repositories → services → insight rules) over a relational
   store with integer-paise money, foreign keys and derived-only totals.
   Persists to localStorage when available, memory otherwise (sandboxed preview).
   ========================================================================== */

/* -------------------------------------------------------------- storage -- */
const DB_KEY = 'spendwise.standalone.v2';
const SESSION_KEY = 'spendwise.session.v2';
const storage = (() => {
  try {
    const probe = '__spendwise_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    return window.localStorage;
  } catch (error) {
    const memory = new Map();
    return {
      getItem: (key) => (memory.has(key) ? memory.get(key) : null),
      setItem: (key, value) => memory.set(key, value),
      removeItem: (key) => memory.delete(key),
    };
  }
})();

/* ------------------------------------------------------------ utilities -- */
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August',
  'September', 'October', 'November', 'December'];

function indianGroup(value) {
  const digits = String(value);
  if (digits.length <= 3) return digits;
  const head = digits.slice(0, -3);
  const tail = digits.slice(-3);
  const parts = [];
  let rest = head;
  while (rest.length > 2) { parts.unshift(rest.slice(-2)); rest = rest.slice(0, -2); }
  if (rest) parts.unshift(rest);
  return [...parts, tail].join(',');
}

function money(paise, opts = {}) {
  const symbol = opts.symbol ?? '₹';
  const negative = paise < 0;
  const value = Math.abs(paise) / 100;
  let text;
  if (opts.compact && value >= 100000) text = `${(value / 100000).toFixed(1)}L`;
  else if (opts.compact && value >= 10000) text = `${(value / 1000).toFixed(1)}k`;
  else {
    const whole = Math.floor(value + 1e-9);
    const frac = Math.round((value - whole) * 100);
    text = indianGroup(whole) + (frac ? `.${String(frac).padStart(2, '0')}` : '');
  }
  return `${negative ? '-' : ''}${symbol}${text}`;
}

const clampPaise = (value) => Math.round(Number(value) || 0);
const parseAmount = (text) => clampPaise(parseFloat(String(text).replace(/[^0-9.]/g, '')) * 100);
const amountText = (paise) => {
  const value = paise / 100;
  return Number.isInteger(value) ? String(value) : value.toFixed(2);
};

const isoOf = (date) => {
  const offset = date.getTimezoneOffset() * 60000;
  return new Date(date.getTime() - offset).toISOString().slice(0, 10);
};
const todayISO = () => isoOf(new Date());
const parseISO = (value) => new Date(`${value}T00:00:00`);
const monthLabel = (year, month) => `${MONTHS_LONG[month - 1]} ${year}`;
const daysInMonth = (year, month) => new Date(year, month, 0).getDate();
const monthBounds = (year, month) => [`${year}-${String(month).padStart(2, '0')}-01`,
  `${year}-${String(month).padStart(2, '0')}-${String(daysInMonth(year, month)).padStart(2, '0')}`];

function shiftMonth(year, month, delta) {
  const index = year * 12 + (month - 1) + delta;
  return { year: Math.floor(index / 12), month: (index % 12) + 1 };
}

function dayLabel(iso) {
  const date = parseISO(iso);
  const today = parseISO(todayISO());
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);
  if (isoOf(date) === isoOf(today)) return 'Today';
  if (isoOf(date) === isoOf(yesterday)) return 'Yesterday';
  return `${date.getDate()} ${MONTHS[date.getMonth()]}`;
}

const escapeHtml = (text) => String(text).replace(/[&<>"']/g, (char) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]
));

/* --------------------------------------------------------------- errors -- */
class DomainError extends Error {
  constructor(code, message, extra = {}) {
    super(message);
    this.code = code;
    this.extra = extra;
  }
}

/* ------------------------------------------------------------- entities -- */
let SEQ = { user: 0, category: 0, expense: 0, budget: 0 };

class Entity {
  constructor(data) { Object.assign(this, data); }
}

class User extends Entity {
  /** The email name — everything before the @. This is also the password. */
  get emailName() { return String(this.email || '').split('@')[0]; }
  get firstName() { return (this.name || this.emailName || 'there').split(' ')[0]; }
  get label() { return this.name || this.emailName; }
}

class Category extends Entity {
  get label() { return `${this.icon} ${this.name}`; }
}

class Expense extends Entity {
  get amount() { return this.amountPaise / 100; }
}

class Budget extends Entity {}

/* --------------------------------------------------------- relational db -- */
class Table {
  constructor(name, EntityClass) {
    this.name = name;
    this.EntityClass = EntityClass;
    this.rows = [];
  }
  all() { return [...this.rows]; }
  byId(id) { return this.rows.find((row) => row.id === Number(id)) || null; }
  where(predicate) { return this.rows.filter(predicate); }
  insert(data) {
    const instance = new this.EntityClass({ ...data, id: ++SEQ[this.name] });
    this.rows.push(instance);
    return instance;
  }
  remove(id) {
    const before = this.rows.length;
    this.rows = this.rows.filter((row) => row.id !== Number(id));
    return this.rows.length < before;
  }
  toJSON() { return this.rows.map((row) => ({ ...row })); }
}

class Database {
  constructor(data = {}) {
    this.sessionUserId = null;
    this.users = new Table('user', User);
    this.categories = new Table('category', Category);
    this.expenses = new Table('expense', Expense);
    this.budgets = new Table('budget', Budget);
    SEQ = data.seq ? { ...data.seq } : { user: 0, category: 0, expense: 0, budget: 0 };
    if (data.users) {
      this.users.rows = data.users.map((row) => new User(row));
      this.categories.rows = (data.categories || []).map((row) => new Category(row));
      this.expenses.rows = (data.expenses || []).map((row) => new Expense(row));
      this.budgets.rows = (data.budgets || []).map((row) => new Budget(row));
    }
  }
  get user() { return this.sessionUserId ? this.users.byId(this.sessionUserId) : null; }
  save() {
    storage.setItem(DB_KEY, JSON.stringify({
      seq: SEQ,
      users: this.users.toJSON(),
      categories: this.categories.toJSON(),
      expenses: this.expenses.toJSON(),
      budgets: this.budgets.toJSON(),
    }));
  }
}

/* --------------------------------------------------------- repositories -- */
class BaseRepository {
  constructor(db, table) { this.db = db; this.table = table; }

  /** Every query is scoped to the signed-in student. */
  get userId() { return this.db.sessionUserId; }

  all() { return this.table.where((row) => row.userId === this.userId); }

  get(id) {
    const row = this.table.byId(id);
    return row && row.userId === this.userId ? row : null;
  }
  getOrFail(id, label) {
    const row = this.get(id);
    if (!row) throw new DomainError('not_found', `${label} not found.`);
    return row;
  }
  insert(data) { return this.table.insert({ ...data, userId: this.userId }); }
  remove(id) { return this.table.remove(id); }
}

class CategoryRepository extends BaseRepository {
  constructor(db) { super(db, db.categories); }
  active() { return this.all().filter((category) => !category.isArchived); }
  byName(name) {
    const needle = name.trim().toLowerCase();
    return this.all().find((category) => category.name.toLowerCase() === needle) || null;
  }
}

class ExpenseRepository extends BaseRepository {
  constructor(db) { super(db, db.expenses); }

  between(from, to) {
    return this.all().filter((expense) => expense.spentAt >= from && expense.spentAt <= to);
  }
  countBetween(from, to) { return this.between(from, to).length; }
  sumBetween(from, to) {
    return this.between(from, to).reduce((total, expense) => total + expense.amountPaise, 0);
  }
  search({ from, to, categoryId, q, sort = 'date_desc', page = 1, pageSize = 25 } = {}) {
    const needle = (q || '').trim().toLowerCase();
    let rows = this.all().filter((expense) => {
      if (from && expense.spentAt < from) return false;
      if (to && expense.spentAt > to) return false;
      if (categoryId && expense.categoryId !== categoryId) return false;
      if (needle && !expense.title.toLowerCase().includes(needle)) return false;
      return true;
    });
    const comparators = {
      date_desc: (a, b) => b.spentAt.localeCompare(a.spentAt) || b.id - a.id,
      date_asc: (a, b) => a.spentAt.localeCompare(b.spentAt) || a.id - b.id,
      amount_desc: (a, b) => b.amountPaise - a.amountPaise || b.spentAt.localeCompare(a.spentAt),
      amount_asc: (a, b) => a.amountPaise - b.amountPaise || b.spentAt.localeCompare(a.spentAt),
    };
    rows.sort(comparators[sort] || comparators.date_desc);
    const total = rows.length;
    const pages = Math.max(1, Math.ceil(total / pageSize));
    const current = Math.min(Math.max(1, page), pages);
    return {
      rows: rows.slice((current - 1) * pageSize, current * pageSize),
      total, page: current, pages, pageSize,
    };
  }
  totalsByCategory(from, to) {
    const map = new Map();
    this.between(from, to).forEach((expense) => {
      const bucket = map.get(expense.categoryId) || { categoryId: expense.categoryId, total: 0, count: 0 };
      bucket.total += expense.amountPaise;
      bucket.count += 1;
      map.set(expense.categoryId, bucket);
    });
    return [...map.values()]
      .map((bucket) => {
        const category = this.db.categories.byId(bucket.categoryId);
        return new CategoryTotal({
          categoryId: bucket.categoryId,
          name: category ? category.name : 'Uncategorised',
          icon: category ? category.icon : '•',
          capPaise: category ? category.capPaise : null,
          totalPaise: bucket.total,
          count: bucket.count,
        });
      })
      .sort((a, b) => b.totalPaise - a.totalPaise);
  }
  dailyTotals(from, to) {
    const map = new Map();
    this.between(from, to).forEach((expense) => {
      map.set(expense.spentAt, (map.get(expense.spentAt) || 0) + expense.amountPaise);
    });
    return map;
  }
}

class BudgetRepository extends BaseRepository {
  constructor(db) { super(db, db.budgets); }
  forPeriod(year, month) {
    return this.all().find((budget) => budget.year === year && budget.month === month) || null;
  }
  latestBefore(year, month) {
    const period = year * 12 + month;
    return this.all()
      .filter((budget) => budget.year * 12 + budget.month < period)
      .sort((a, b) => (b.year * 12 + b.month) - (a.year * 12 + a.month))[0] || null;
  }
  upsert(year, month, totalPaise) {
    const existing = this.forPeriod(year, month);
    if (existing) { existing.totalPaise = totalPaise; return existing; }
    return this.insert({ year, month, totalPaise });
  }
}

/* ------------------------------------------------------- derived models -- */
class CategoryTotal {
  constructor(data) { Object.assign(this, data); }
  share(grandTotal) { return grandTotal > 0 ? (this.totalPaise / grandTotal) * 100 : 0; }
  get overCap() { return Boolean(this.capPaise && this.totalPaise > this.capPaise); }
}

class BudgetStatus {
  constructor({ year, month, totalPaise, spentPaise, today, categoryTotals }) {
    this.year = year;
    this.month = month;
    this.totalPaise = totalPaise;
    this.spentPaise = spentPaise;
    this.today = today;
    this.categoryTotals = categoryTotals;
  }
  get daysInMonth() { return daysInMonth(this.year, this.month); }
  get isCurrentMonth() {
    return this.today.getFullYear() === this.year && this.today.getMonth() + 1 === this.month;
  }
  get daysElapsed() {
    if (this.isCurrentMonth) return Math.max(1, this.today.getDate());
    const now = this.today.getFullYear() * 12 + this.today.getMonth() + 1;
    return (this.year * 12 + this.month) < now ? this.daysInMonth : 0;
  }
  get daysLeft() { return this.isCurrentMonth ? Math.max(0, this.daysInMonth - this.daysElapsed) : 0; }
  get remainingPaise() { return this.totalPaise - this.spentPaise; }
  get percentUsed() {
    return this.totalPaise > 0 ? Math.round((this.spentPaise / this.totalPaise) * 1000) / 10 : 0;
  }
  get dailyAveragePaise() {
    return this.daysElapsed ? Math.round(this.spentPaise / this.daysElapsed / 100) * 100 : 0;
  }
  get safeDailyPaise() {
    if (!this.isCurrentMonth) return 0;
    const days = Math.max(1, this.daysInMonth - this.today.getDate() + 1);
    return Math.max(0, Math.round(this.remainingPaise / days / 100) * 100);
  }
  get projectedPaise() {
    if (!this.isCurrentMonth || !this.daysElapsed) return this.spentPaise;
    return Math.round((this.spentPaise / this.daysElapsed) * this.daysInMonth / 100) * 100;
  }
  get state() {
    if (this.totalPaise <= 0) return 'ok';
    if (this.spentPaise > this.totalPaise) return 'over';
    return this.percentUsed >= 80 ? 'warn' : 'ok';
  }
}

/* --------------------------------------------------------------- services -- */
class BudgetService {
  constructor(db) { this.db = db; this.budgets = new BudgetRepository(db); this.expenses = new ExpenseRepository(db); }
  totalFor(year, month) {
    const budget = this.budgets.forPeriod(year, month);
    if (budget) return budget.totalPaise;
    const previous = this.budgets.latestBefore(year, month);
    return previous ? previous.totalPaise : 0;
  }
  setTotal(year, month, totalPaise) {
    if (totalPaise < 0) throw new DomainError('validation_error', 'Budget cannot be negative.');
    this.budgets.upsert(year, month, totalPaise);
  }
  status(year, month, today = new Date()) {
    const [from, to] = monthBounds(year, month);
    return new BudgetStatus({
      year, month,
      totalPaise: this.totalFor(year, month),
      spentPaise: this.expenses.sumBetween(from, to),
      today,
      categoryTotals: this.expenses.totalsByCategory(from, to),
    });
  }
}

class ExpenseService {
  constructor(db) {
    this.db = db;
    this.expenses = new ExpenseRepository(db);
    this.categories = new CategoryRepository(db);
    this.budgets = new BudgetService(db);
  }
  static validate({ title, amountPaise, spentAt }) {
    const clean = (title || '').trim();
    if (!clean) throw new DomainError('validation_error', 'Give the expense a short title.');
    if (clean.length > 60) throw new DomainError('validation_error', 'Title must be 60 characters or fewer.');
    if (!amountPaise || amountPaise <= 0) throw new DomainError('validation_error', 'Amount must be greater than zero.');
    if (amountPaise > 100000000) throw new DomainError('validation_error', 'That amount looks too large.');
    if (!spentAt) throw new DomainError('validation_error', 'Pick a date for this expense.');
    if (spentAt > todayISO()) throw new DomainError('validation_error', 'Expense date cannot be in the future.');
    const oneYearAgo = new Date();
    oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
    if (spentAt < isoOf(oneYearAgo)) throw new DomainError('validation_error', 'You can only backdate up to one year.');
  }
  guardBudget(spentAt, amountPaise) {
    const date = parseISO(spentAt);
    const status = this.budgets.status(date.getFullYear(), date.getMonth() + 1, date);
    if (status.totalPaise <= 0) return;
    if (status.spentPaise + amountPaise > status.totalPaise) {
      const overBy = status.spentPaise + amountPaise - status.totalPaise;
      throw new DomainError('over_budget',
        `This expense puts you ${money(overBy)} over budget for ${monthLabel(status.year, status.month)}.`,
        { overBy, remainingPaise: status.remainingPaise });
    }
  }
  create(input, { confirmOverBudget = false } = {}) {
    ExpenseService.validate(input);
    this.categories.getOrFail(input.categoryId, 'Category');
    if (!confirmOverBudget) this.guardBudget(input.spentAt, input.amountPaise);
    return this.expenses.insert({
      title: input.title.trim(),
      amountPaise: input.amountPaise,
      categoryId: Number(input.categoryId),
      spentAt: input.spentAt,
      paymentMethod: input.paymentMethod || 'gpay',
      note: (input.note || '').trim() || null,
      createdAt: new Date().toISOString(),
    });
  }
  update(id, input) {
    const expense = this.expenses.getOrFail(id, 'Expense');
    ExpenseService.validate(input);
    this.categories.getOrFail(input.categoryId, 'Category');
    Object.assign(expense, {
      title: input.title.trim(),
      amountPaise: input.amountPaise,
      categoryId: Number(input.categoryId),
      spentAt: input.spentAt,
      paymentMethod: input.paymentMethod,
      note: (input.note || '').trim() || null,
    });
    return expense;
  }
  remove(id) {
    const expense = this.expenses.getOrFail(id, 'Expense');
    const snapshot = { ...expense };
    this.expenses.remove(id);
    return snapshot;
  }
  restore(snapshot) {
    return this.expenses.insert({ ...snapshot, id: undefined });
  }
}

/* ------------------------------------------------------- insight rules -- */
class InsightRule {
  constructor({ priority = 100, tone = 'neutral' } = {}) {
    this.priority = priority;
    this.tone = tone;
  }
  applies() { return false; }
  message() { return ''; }
  evaluate(context) {
    if (!this.applies(context)) return null;
    const text = this.message(context);
    return { tone: this.tone, text };
  }
}

class PaceRule extends InsightRule {
  constructor() { super({ priority: 10 }); }
  applies({ status }) { return status.isCurrentMonth && status.totalPaise > 0 && status.daysLeft > 0; }
  message({ status }) {
    const gap = Math.round(status.projectedPaise - status.totalPaise);
    if (gap > 0) {
      this.tone = 'warning';
      return `At your current pace you'll finish the month about ${money(gap)} over budget.`;
    }
    this.tone = 'positive';
    return `You're on pace to finish about ${money(-gap)} under budget — about ${money(status.safeDailyPaise)}/day is safe.`;
  }
}

class TopCategoryRule extends InsightRule {
  constructor() { super({ priority: 20 }); }
  applies({ categories, grandTotal }) { return categories.length > 0 && grandTotal > 0; }
  message({ categories, grandTotal, previousCategories }) {
    const top = categories[0];
    const share = Math.round((top.totalPaise / grandTotal) * 100);
    const previous = previousCategories.find((item) => item.categoryId === top.categoryId);
    if (previous && previous.totalPaise) {
      const delta = top.totalPaise - previous.totalPaise;
      this.tone = delta > 0 ? 'warning' : 'positive';
      return `${top.name} is ${share}% of your spend — ${money(Math.abs(delta))} ${delta >= 0 ? 'more' : 'less'} than last month.`;
    }
    this.tone = 'neutral';
    return `${top.name} is ${share}% of your spend this month.`;
  }
}

class MonthOverMonthRule extends InsightRule {
  constructor() { super({ priority: 30 }); }
  applies({ previousSpentPaise }) { return previousSpentPaise > 0; }
  message({ status, previousSpentPaise }) {
    const delta = status.spentPaise - previousSpentPaise;
    const percent = Math.round((Math.abs(delta) / previousSpentPaise) * 100);
    this.tone = delta > 0 ? 'warning' : 'positive';
    return delta > 0
      ? `You've spent ${percent}% more than this point last month.`
      : `You've spent ${percent}% less than this point last month.`;
  }
}

class EmptyMonthRule extends InsightRule {
  constructor() { super({ priority: 90 }); }
  applies({ grandTotal }) { return grandTotal === 0; }
  message() { return 'No expenses logged for this month yet — add one to see insights.'; }
}

class InsightEngine {
  constructor(rules = [new PaceRule(), new TopCategoryRule(), new MonthOverMonthRule(), new EmptyMonthRule()]) {
    this.rules = [...rules].sort((a, b) => a.priority - b.priority);
  }
  generate(context, limit = 3) {
    const output = [];
    for (const rule of this.rules) {
      const result = rule.evaluate(context);
      if (result) output.push(result);
      if (output.length >= limit) break;
    }
    return output;
  }
}

function mulberry32(seed) {
  let value = seed;
  return () => {
    value |= 0; value = (value + 0x6d2b79f5) | 0;
    let t = Math.imul(value ^ (value >>> 15), 1 | value);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Three months of realistic campus spending for the demo student. */
function seedDemoData(db, userId, { today = new Date(), allowancePaise = 900000 } = {}) {
  const random = mulberry32(20260801);
  const pick = (list) => list[Math.floor(random() * list.length)];
  const between = (low, high) => low + Math.floor(random() * (high - low + 1));
  const weightedTemplate = () => {
    const total = SEED_TEMPLATES.reduce((sum, item) => sum + item[4], 0);
    let roll = random() * total;
    for (const template of SEED_TEMPLATES) {
      roll -= template[4];
      if (roll <= 0) return template;
    }
    return SEED_TEMPLATES[0];
  };

  const byName = createDefaultCategories(db, userId);
  const year0 = today.getFullYear();
  const month0 = today.getMonth() + 1;

  for (let delta = -2; delta <= 0; delta += 1) {
    const { year, month } = shiftMonth(year0, month0, delta);
    const total = daysInMonth(year, month);
    const lastDay = delta === 0 ? today.getDate() : total;
    db.budgets.insert({ year, month, totalPaise: allowancePaise, userId });

    // Hostel rent on the 3rd, like clockwork.
    if (lastDay >= 3) {
      db.expenses.insert({
        title: 'Hostel rent share',
        amountPaise: 135000,
        categoryId: byName.get('Hostel & Rent'),
        spentAt: `${year}-${String(month).padStart(2, '0')}-03`,
        paymentMethod: 'gpay',
        note: null,
        createdAt: new Date().toISOString(),
        userId,
      });
    }
    // Semester fee once, at the start two months back.
    if (delta === -2) {
      db.expenses.insert({
        title: 'Semester exam fee',
        amountPaise: 60000,
        categoryId: byName.get('Exams & Fees'),
        spentAt: `${year}-${String(month).padStart(2, '0')}-05`,
        paymentMethod: 'card',
        note: null,
        createdAt: new Date().toISOString(),
        userId,
      });
    }

    for (let day = 1; day <= lastDay; day += 1) {
      const spentAt = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const weekday = new Date(`${spentAt}T00:00:00`).getDay();
      let entries = pick([1, 1, 2, 2, 3]);
      if ((weekday === 0 || weekday === 6) && random() < 0.4) entries += 1;
      for (let n = 0; n < entries; n += 1) {
        const [title, categoryName, low, high] = weightedTemplate();
        db.expenses.insert({
          title,
          amountPaise: between(low, high) * 100,
          categoryId: byName.get(categoryName),
          spentAt,
          paymentMethod: pick(['gpay', 'gpay', 'gpay', 'fampay', 'fampay', 'card']),
          note: null,
          createdAt: new Date().toISOString(),
          userId,
        });
      }
    }
  }
}

/* ----------------------------------------------------------------- auth -- */
/* Client-side demo authentication. Passwords are stretched with PBKDF2 via
   Web Crypto where available and stored salted — enough to gate a local demo,
   not a substitute for the server-side hashing in the FastAPI edition.

   Password rule (college demo convention): the password IS the part of the
   email before the @.  nishaantk@gmail.com  ->  password "nishaantk".          */

/** The password for an email address: everything before the "@". */
function passwordForEmail(email) {
  return String(email || '').trim().toLowerCase().split('@')[0];
}

const REPO = 'spendwise-auth';
const ITERATIONS = 120000;
const encoder = new TextEncoder();

function toHex(buffer) {
  return [...new Uint8Array(buffer)].map((byte) => byte.toString(16).padStart(2, '0')).join('');
}

function fallbackHash(password, salt) {
  // Only used when Web Crypto is unavailable (non-secure context).
  let hash = 2166136261;
  const material = `${salt}:${password}:${REPO}`;
  for (let round = 0; round < 5000; round += 1) {
    for (let index = 0; index < material.length; index += 1) {
      hash ^= material.charCodeAt(index) + round;
      hash = Math.imul(hash, 16777619) >>> 0;
    }
  }
  return hash.toString(16).padStart(8, '0').repeat(4);
}

async function hashPassword(password, salt) {
  const hasCrypto = Boolean(window.crypto && window.crypto.subtle);
  if (!hasCrypto) return `fnv1a$5000$${salt}$${fallbackHash(password, salt)}`;
  const key = await window.crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await window.crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: encoder.encode(salt), iterations: ITERATIONS, hash: 'SHA-256' },
    key,
    256,
  );
  return `pbkdf2$${ITERATIONS}$${salt}$${toHex(bits)}`;
}

async function verifyPassword(password, stored) {
  if (!stored) return false;
  const [scheme, , salt] = stored.split('$');
  const candidate = scheme === 'pbkdf2'
    ? await hashPassword(password, salt)
    : `fnv1a$5000$${salt}$${fallbackHash(password, salt)}`;
  return candidate === stored;
}

const auth = {
  get currentUser() {
    return db.sessionUserId ? db.users.byId(db.sessionUserId) : null;
  },
  signIn(user) {
    /* The session lives in memory only: reloading the page always returns to
       the sign-in screen, so whoever opens the link sees the login page first. */
    db.sessionUserId = user.id;
  },
  signOut() {
    db.sessionUserId = null;
  },
  byEmail(email) {
    const needle = String(email || '').trim().toLowerCase();
    return db.users.all().find((user) => user.email.toLowerCase() === needle) || null;
  },
  async register({ name, email, password, college, allowancePaise }) {
    const cleanEmail = String(email || '').trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(cleanEmail)) {
      throw new DomainError('validation_error', 'Enter a valid email address.');
    }
    if (this.byEmail(cleanEmail)) {
      throw new DomainError('conflict', 'An account with this email already exists.');
    }
    const salt = toHex(window.crypto && window.crypto.getRandomValues
      ? window.crypto.getRandomValues(new Uint8Array(12))
      : String(Math.random()).slice(2));
    const user = db.users.insert({
      email: cleanEmail,
      name: String(name || '').trim() || passwordForEmail(cleanEmail),
      college: String(college || '').trim(),
      currency: 'INR',
      isDemo: false,
      passwordHash: await hashPassword(passwordForEmail(cleanEmail), salt),
      allowancePaise: Math.max(0, Number(allowancePaise) || 0),
      createdAt: new Date().toISOString(),
    });
    db.sessionUserId = user.id;
    createDefaultCategories(db, user.id);
    const period = { year: new Date().getFullYear(), month: new Date().getMonth() + 1 };
    if (user.allowancePaise > 0) db.budgets.insert({ ...period, totalPaise: user.allowancePaise, userId: user.id });
    db.save();
    return user;
  },
  async login({ email, password }) {
    const cleanEmail = String(email || '').trim().toLowerCase();
    let user = this.byEmail(cleanEmail);
    const expected = passwordForEmail(user ? user.email : cleanEmail);
    const typed = String(password || '').trim().toLowerCase().replace(/\s+/g, '');
    // Accept the email name, and (forgivingly) the whole email typed as the password.
    if (typed !== expected && typed !== cleanEmail) {
      throw new DomainError(
        'validation_error',
        `Incorrect password. It is the part of your email before the @ — "${expected}".`,
      );
    }
    if (!user) {
      // First sign-in for this email: provision the account so nobody hits a
      // dead end. Name, college and allowance can be changed later in Settings.
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(cleanEmail) || expected.length < 3) {
        throw new DomainError('validation_error', 'Enter a valid email address.');
      }
      user = this.provision(cleanEmail, expected);
      user.justCreated = true;
    }
    this.signIn(user);
    return user;
  },

  /** Create an account with the default college categories and allowance. */
  provision(email, name, allowancePaise = 900000) {
    const user = db.users.insert({
      email,
      name: name || 'Student',
      college: '',
      currency: 'INR',
      isDemo: false,
      passwordHash: null,
      allowancePaise,
      createdAt: new Date().toISOString(),
    });
    db.sessionUserId = user.id;
    createDefaultCategories(db, user.id);
    if (allowancePaise > 0) {
      db.budgets.insert({
        year: new Date().getFullYear(),
        month: new Date().getMonth() + 1,
        totalPaise: allowancePaise,
        userId: user.id,
      });
    }
    db.save();
    return user;
  },
  demo() {
    let user = this.byEmail('demo@spendwise.app');
    if (!user) {
      user = db.users.all().find((candidate) => candidate.isDemo);
    }
    this.signIn(user);
    return user;
  },
};

function summaryFor(year, month) {
  const status = budgetService.status(year, month);
  const grandTotal = status.spentPaise;
  const previousPeriod = shiftMonth(year, month, -1);
  const previousStatus = budgetService.status(previousPeriod.year, previousPeriod.month);
  const [prevFrom, prevTo] = monthBounds(previousPeriod.year, previousPeriod.month);
  const previousSpent = status.isCurrentMonth
    ? expenseService.expenses.sumBetween(prevFrom, `${previousPeriod.year}-${String(previousPeriod.month).padStart(2, '0')}-${String(Math.min(status.daysElapsed, daysInMonth(previousPeriod.year, previousPeriod.month))).padStart(2, '0')}`)
    : expenseService.expenses.sumBetween(prevFrom, prevTo);

  const insights = insightEngine.generate({
    status,
    categories: status.categoryTotals,
    grandTotal,
    previousCategories: previousStatus.categoryTotals,
    previousSpentPaise: previousSpent,
  });

  return {
    status,
    categories: status.categoryTotals,
    grandTotal,
    previous: { ...previousPeriod, spentPaise: previousStatus.spentPaise, sameWindowPaise: previousSpent },
    insights,
    expenseCount: status.categoryTotals.reduce((sum, item) => sum + item.count, 0),
  };
}

function trendFor(months = 6) {
  const output = [];
  for (let delta = -(months - 1); delta <= 0; delta += 1) {
    const { year, month } = shiftMonth(state.period.year, state.period.month, delta);
    const [from, to] = monthBounds(year, month);
    output.push({
      year, month, label: MONTHS[month - 1],
      spentPaise: expenseService.expenses.sumBetween(from, to),
      budgetPaise: budgetService.totalFor(year, month),
    });
  }
  return output;
}

function dailyFor(year, month) {
  const [from, to] = monthBounds(year, month);
  const totals = expenseService.expenses.dailyTotals(from, to);
  const days = daysInMonth(year, month);
  return Array.from({ length: days }, (_, index) => {
    const day = index + 1;
    const key = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    return { day, spentPaise: totals.get(key) || 0 };
  });
}

</svg>`;
const GREY_RAMP = ['#4b4b57', '#3c3c47', '#33333d'];
const sliceColor = (index) => (index === 0 ? PURPLE : GREY_RAMP[Math.min(index - 1, GREY_RAMP.length - 1)]);

/* --------------------------------------------------------------- toasts -- */
let toastSeq = 0;
function notify(message, options = {}) {
  const id = ++toastSeq;
  state.toasts = [...state.toasts.slice(-2), { id, message, tone: options.tone, undo: options.undo }];
  renderToasts();
  window.setTimeout(() => {
    state.toasts = state.toasts.filter((toast) => toast.id !== id);
    renderToasts();
  }, options.undo ? 7000 : 4000);
}
function renderToasts() {
  const host = document.getElementById('toasts');
  if (!host) return;
  host.innerHTML = state.toasts.map((toast) => `
    <div class="toast ${toast.tone || ''}">
      <span>${escapeHtml(toast.message)}</span>
      <span style="display:flex;gap:4px">
        ${toast.undo ? `<button class="act" data-act="toast-undo" data-id="${toast.id}">Undo</button>` : ''}
        <button class="act" data-act="toast-dismiss" data-id="${toast.id}" aria-label="Dismiss">✕</button>
      </span>
    </div>`).join('');
}

/* --------------------------------------------------------------- charts -- */
function donutSvg(categories, total, size = 168) {
  const radius = size / 2 - 10;
  const circumference = 2 * Math.PI * radius;
  let offset = 0;
  const arcs = categories.map((slice, index) => {
    const fraction = total > 0 ? slice.totalPaise / total : 0;
    const dash = fraction * circumference;
    const arc = `<circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none"
      stroke="${sliceColor(index)}" stroke-width="12"
      stroke-dasharray="${Math.max(dash - 2, 0)} ${circumference}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 ${size / 2} ${size / 2})"><title>${escapeHtml(slice.name)}: ${money(slice.totalPaise)}</title></circle>`;
    offset += dash;
    return arc;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img"
      aria-label="Spending split by category">
    <circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke="#202028" stroke-width="12" />
    ${arcs}
    <text x="50%" y="47%" text-anchor="middle" fill="#f4f4f5" font-size="17" font-weight="640">${money(total, { compact: true })}</text>
    <text x="50%" y="60%" text-anchor="middle" fill="#8a8a99" font-size="10.5">spent</text>
  </svg>`;
}

function legendHtml(categories, total) {
  if (!categories.length) return '<span class="dim">Nothing categorised yet.</span>';
  const rows = categories.slice(0, 6).map((slice, index) => `
    <div class="legend-row">
      <span class="legend-swatch" style="background:${sliceColor(index)}"></span>
      <span class="legend-name">${slice.icon} ${escapeHtml(slice.name)}</span>
      <span class="legend-val">${money(slice.totalPaise)}<span class="dim"> · ${Math.round((slice.totalPaise / (total || 1)) * 100)}%</span></span>
    </div>`).join('');
  const more = categories.length > 6 ? `<span class="dim">+${categories.length - 6} more categories</span>` : '';
  return `<div class="legend">${rows}${more}</div>`;
}

function barsSvg(points) {
  const width = 320, height = 132, top = 10, bottom = 20;
  const usable = height - top - bottom;
  const max = Math.max(1, ...points.map((point) => Math.max(point.spentPaise, point.budgetPaise)));
  const slot = width / Math.max(1, points.length);
  const barWidth = Math.min(24, slot * 0.5);
  const grid = [0.25, 0.5, 0.75, 1].map((ratio) =>
    `<line x1="0" x2="${width}" y1="${top + usable * ratio}" y2="${top + usable * ratio}" stroke="#202028" stroke-width="1" />`).join('');
  const bars = points.map((point, index) => {
    const barHeight = (point.spentPaise / max) * usable;
    const x = slot * index + slot / 2 - barWidth / 2;
    const over = point.budgetPaise > 0 && point.spentPaise > point.budgetPaise;
    return `<g>
      <rect x="${x}" y="${top + usable - barHeight}" width="${barWidth}" height="${Math.max(barHeight, 1)}" rx="3"
        fill="${over ? '#f87171' : PURPLE}" opacity="${index === points.length - 1 ? 1 : 0.55}">
        <title>${point.label}: ${money(point.spentPaise)}</title>
      </rect>
      <text x="${slot * index + slot / 2}" y="${height - 5}" text-anchor="middle" fill="#5f5f6d" font-size="9.5">${point.label}</text>
    </g>`;
  }).join('');
  return `<svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"
      role="img" aria-label="Monthly spending for recent months">${grid}${bars}</svg>`;
}

function areaSvg(points, height = 120) {
  const width = 560, pad = 4;
  const max = Math.max(1, ...points.map((point) => point.spentPaise));
  const step = (width - pad * 2) / Math.max(1, points.length - 1);
  const coords = points.map((point, index) => {
    const x = pad + index * step;
    const y = height - pad - (point.spentPaise / max) * (height - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const line = `M ${coords.join(' L ')}`;
  const area = `${line} L ${width - pad},${height - pad} L ${pad},${height - pad} Z`;
  return `<svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"
      role="img" aria-label="Daily spending this month">
    <defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${PURPLE}" stop-opacity="0.28" />
      <stop offset="100%" stop-color="${PURPLE}" stop-opacity="0" />
    </linearGradient></defs>
    <path d="${area}" fill="url(#areaFill)" />
    <path d="${line}" fill="none" stroke="${PURPLE}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
  </svg>`;
}

function capRing(used, cap) {
  const size = 44, radius = 18, circumference = 2 * Math.PI * radius;
  const ratio = cap && cap > 0 ? Math.min(1, used / cap) : 0;
  const over = Boolean(cap && used > cap);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="22" cy="22" r="${radius}" fill="none" stroke="#26262f" stroke-width="4" />
    <circle cx="22" cy="22" r="${radius}" fill="none" stroke="${over ? '#f87171' : PURPLE}" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${ratio * circumference} ${circumference}"
      transform="rotate(-90 22 22)" />
    <text x="50%" y="56%" text-anchor="middle" fill="#8a8a99" font-size="9.5">${cap ? `${Math.round((used / cap) * 100)}%` : '—'}</text>
  </svg>`;
}

  const hero = `

function insightsHtml() {
  const summary = summaryFor(state.period.year, state.period.month);
  const { status, categories, insights, previous } = summary;
  const trend = trendFor(6);

  const now = new Date();
  const nextDisabled = state.period.year > now.getFullYear()
    || (state.period.year === now.getFullYear() && state.period.month >= now.getMonth() + 1);

  state.editing = expense ? expense.id : null;
  state.draft = expense
    ? {
      amount: amountText(expense.amountPaise), title: expense.title, categoryId: expense.categoryId,
      spentAt: expense.spentAt, paymentMethod: expense.paymentMethod, note: expense.note || '', error: null, warn: null,
    }
    : {
      amount: '', title: '', categoryId: (categoriesRepo.active()[0] || {}).id || null,
      spentAt: todayISO(), paymentMethod: 'gpay', note: '', error: null, warn: null,

  state.editing = null;

function saveExpense(confirmOverBudget = false) {
  const draft = state.draft;
  if (!draft) return;
  draft.amount = (document.getElementById('amount') || {}).value ?? draft.amount;
  draft.title = (document.getElementById('title') || {}).value ?? draft.title;
  draft.note = (document.getElementById('note') || {}).value ?? draft.note;
  draft.spentAt = (document.getElementById('spent-at') || {}).value ?? draft.spentAt;
  draft.paymentMethod = (document.getElementById('method') || {}).value ?? draft.paymentMethod;

  const payload = {
    title: draft.title,
    amountPaise: parseAmount(draft.amount),
    categoryId: draft.categoryId,
    spentAt: draft.spentAt,
    paymentMethod: draft.paymentMethod,
    note: draft.note,
  };

  try {
    if (!draft.categoryId) throw new DomainError('validation_error', 'Pick a category first.');
    if (state.editing) {
      expenseService.update(state.editing, payload);
      persist();
      closeModal();
      notify('Expense updated.');
    } else {
      expenseService.create(payload, { confirmOverBudget });
      persist();
      const category = db.categories.byId(draft.categoryId);
      closeModal();
      notify(`${money(payload.amountPaise)} added to ${category ? category.name : 'expenses'}.`);
    }
    state.filters.page = 1;
    render();
  } catch (error) {
    if (error instanceof DomainError && error.code === 'over_budget') {
      draft.warn = error.message;
      draft.error = null;
    } else {
      draft.error = error.message || 'Could not save the expense.';
    }
    renderModal();
  }
}

/* -------------------------------------------------------------- actions -- */
function deleteExpense(id) {
  try {
    const snapshot = expenseService.remove(id);
    persist();
    render();
    notify('Expense deleted.', {
      undo: () => {
        expenseService.restore(snapshot);
        persist();
        render();
        notify('Expense restored.');
      },
    });
  } catch (error) {
    notify(error.message || 'Could not delete that expense.', { tone: 'error' });
  }
}

function saveBudget() {
  const input = document.getElementById('budget-total');
  const paise = parseAmount(input ? input.value : '0');
  try {
    budgetService.setTotal(state.period.year, state.period.month, paise);
    persist();
    render();
    notify(`Monthly budget set to ${money(paise)}.`);
  } catch (error) {
    notify(error.message || 'Could not save the budget.', { tone: 'error' });
  }
}

function saveCap(id) {
  const input = document.querySelector(`[data-input="cap"][data-id="${id}"]`);
  const category = db.categories.byId(id);
  if (!category) return;
  const paise = parseAmount(input ? input.value : '');
  category.capPaise = paise > 0 ? paise : null;
  persist();
  render();
  notify(paise > 0 ? `${category.name} cap set to ${money(paise)}.` : `${category.name} cap removed.`);
}

function addCategory() {
  const nameInput = document.getElementById('new-category');
  const capInput = document.getElementById('new-cap');
  const name = (nameInput ? nameInput.value : '').trim();
  if (!name) { notify('Give the category a name.', { tone: 'warn' }); return; }
  if (categoriesRepo.byName(name)) { notify('You already have a category with that name.', { tone: 'error' }); return; }
  const cap = parseAmount(capInput ? capInput.value : '');
  db.categories.insert({
    name, icon: (state.draft && state.draft.icon) || '•',
    capPaise: cap > 0 ? cap : null, isArchived: false,
  });
  persist();
  render();
  notify(`Category “${name}” added.`);
}

function deleteCategory(id) {
  const category = db.categories.byId(id);
  if (!category) return;
  const used = db.expenses.where((expense) => expense.categoryId === id).length;
  if (used > 0) {
    category.isArchived = true;
    persist();
    render();
    notify(`“${category.name}” archived — its ${used} expenses stay in your history.`);
    return;
  }
  db.categories.remove(id);
  persist();
  render();
  notify(`“${category.name}” deleted.`);
}

function archiveCategory(id) {
  const category = db.categories.byId(id);
  if (!category) return;
  category.isArchived = !category.isArchived;
  persist();
  render();
  notify(category.isArchived ? `“${category.name}” archived.` : `“${category.name}” restored.`);
}

function exportCsv() {
  const rows = [['Date', 'Title', 'Category', 'Payment method', 'Amount (INR)', 'Note']];
  db.expenses.all()
    .slice()
    .sort((a, b) => b.spentAt.localeCompare(a.spentAt))
    .forEach((expense) => {
      const category = categoryOf(expense);
      rows.push([
        expense.spentAt, expense.title, category ? category.name : '',
        expense.paymentMethod, (expense.amountPaise / 100).toFixed(2), expense.note || '',
      ]);
    });
  const csv = rows.map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `spendwise-${todayISO()}.csv`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  notify('CSV downloaded.');
}

function wipeData() {
  db.expenses.rows = [];
  db.budgets.rows = [];
  db.categories.rows = [];
  db.categories.insert({ name: 'Food', icon: '🍜', capPaise: null, isArchived: false });
  db.categories.insert({ name: 'Transport', icon: '🚌', capPaise: null, isArchived: false });
  db.categories.insert({ name: 'Other', icon: '•', capPaise: null, isArchived: false });
  persist();
  render();
  notify('All expense data removed.');
}

/* ---------------------------------------------------------------- auth -- */
function setAuthMode(mode) {
  state.authMode = mode;
  state.authError = null;
  state.authDraft = { ...(state.authDraft || {}), password: '' };
  render();
}

async function handleAuthSubmit() {
  const value = (id) => {
    const element = document.getElementById(id);
    return element ? element.value : '';
  };
  const email = value('auth-email');
  const password = value('auth-password') || passwordForEmail(email);
  state.authDraft = {
    name: value('auth-name'),
    college: value('auth-college'),
    email,
    allowance: value('auth-allowance'),
  };
  state.authBusy = true;
  state.authError = null;
  render();

  let created = false;
  try {
    if (state.authMode === 'login') {
      const user = await auth.login({ email, password });
      created = Boolean(user && user.justCreated);
    } else {
      await auth.register({
        name: state.authDraft.name,
        college: state.authDraft.college,
        email,
        password,
        allowancePaise: parseAmount(state.authDraft.allowance || ''),
      });
    }
    state.authBusy = false;
    state.authError = null;
    state.authDraft = null;
    state.period = { year: new Date().getFullYear(), month: new Date().getMonth() + 1 };
    state.view = 'dashboard';
    render();
    notify(created
      ? 'Account created with a ₹9,000 monthly allowance — edit it in Budgets.'
      : state.authMode === 'login'
        ? 'Signed in. Welcome back.'
        : 'Account created — your budget is ready.');
  } catch (error) {
    state.authBusy = false;
    state.authError = error.message || 'Could not sign you in. Try again.';
    render();
  }
}

function signOut() {
  auth.signOut();
  state.draft = null;
  state.view = 'dashboard';
  state.authMode = 'login';
  state.authDraft = null;
  state.authError = null;
  state.authBusy = false;
  state.filters = { range: 'this_month', categoryId: 'all', q: '', sort: 'date_desc', page: 1 };
  render();
  notify('Signed out.');
}

/* --------------------------------------------------------------- events -- */
document.addEventListener('click', (event) => {
  const stop = event.target.closest('[data-stop]');
  const target = event.target.closest('[data-act]');
  if (!target) return;
  const act = target.dataset.act;

  if (act === 'overlay-close' && stop) return;

  switch (act) {
    case 'nav':
      state.view = target.dataset.view;
      state.filters.page = 1;
      render();
      break;
    case 'open-add':
      openAddModal(null);
      break;
    case 'edit':
      openAddModal(db.expenses.byId(Number(target.dataset.id)));
      break;
    case 'delete':
      deleteExpense(Number(target.dataset.id));
      break;
    case 'close-modal':
    case 'overlay-close':
      closeModal();
      break;
    case 'save-anyway':
      saveExpense(true);
      break;
    case 'pick-category': {
      state.draft.categoryId = Number(target.dataset.id);
      state.draft.warn = null;
      renderModal();
      break;
    }
    case 'pick-icon':
      state.draft = { ...(state.draft || {}), icon: target.dataset.icon };
      render();
      break;
    case 'set-range':
      state.filters.range = target.dataset.range;
      state.filters.page = 1;
      document.getElementById('expense-table').innerHTML = expenseTableHtml();
      document.querySelectorAll('[data-act="set-range"]').forEach((button) => {
        button.classList.toggle('on', button.dataset.range === state.filters.range);
      });
      break;
    case 'page':
      state.filters.page = Number(target.dataset.page);
      document.getElementById('expense-table').innerHTML = expenseTableHtml();
      break;
    case 'clear-filters':
      state.filters = { range: 'all', categoryId: 'all', q: '', sort: 'date_desc', page: 1 };
      render();
      break;
    case 'month': {
      const next = shiftMonth(state.period.year, state.period.month, Number(target.dataset.delta));
      state.period = next;
      render();
      break;
    }
    case 'save-budget':
      saveBudget();
      break;
    case 'save-cap':
      saveCap(Number(target.dataset.id));
      break;
    case 'add-category':
      addCategory();
      break;
    case 'delete-category':
      deleteCategory(Number(target.dataset.id));
      break;
    case 'archive-category':
      archiveCategory(Number(target.dataset.id));
      break;
    case 'export-csv':
      exportCsv();
      break;
    case 'wipe':
      wipeData();
      break;
    case 'refresh':
      render();
      notify('Figures refreshed.');
      break;
    case 'reset-demo':
      resetDemo();
      break;
    case 'auth-tab':
      setAuthMode(target.dataset.mode);
      break;
    case 'auth-submit':
      handleAuthSubmit();
      break;
    case 'toggle-password': {
      const field = document.getElementById('auth-password');
      if (field) {
        const showing = field.type === 'text';
        field.type = showing ? 'password' : 'text';
        target.textContent = showing ? 'Show' : 'Hide';
        target.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      }
      break;
    }
    case 'save-expense':
      saveExpense(false);
      break;
    case 'auth-demo': {
      try {
        auth.demo();
        state.authError = null;
        state.period = { year: new Date().getFullYear(), month: new Date().getMonth() + 1 };
        state.view = 'dashboard';
        render();
        notify('Signed in as the demo student.');
      } catch (error) {
        state.authError = error.message || 'Could not open the demo.';
        render();
      }
      break;
    }
    case 'sign-out':
      signOut();
      break;
    case 'toast-dismiss':
      state.toasts = state.toasts.filter((toast) => toast.id !== Number(target.dataset.id));
      renderToasts();
      break;
    case 'toast-undo': {
      const toast = state.toasts.find((item) => item.id === Number(target.dataset.id));
      state.toasts = state.toasts.filter((item) => item.id !== Number(target.dataset.id));
      renderToasts();
      if (toast && toast.undo) toast.undo();
      break;
    }
    default:
      break;
  }
});

document.addEventListener('input', (event) => {
  const target = event.target;
  const key = target.dataset ? target.dataset.input : null;
  if (!key) return;
  if (key === 'search') {
    state.filters.q = target.value;
    state.filters.page = 1;
    window.clearTimeout(window.__searchTimer);
    window.__searchTimer = window.setTimeout(() => {
      const table = document.getElementById('expense-table');
      if (table) table.innerHTML = expenseTableHtml();
    }, 220);
    return;
  }
  if (['auth-name', 'auth-college', 'auth-email', 'auth-allowance'].includes(key)) {
    state.authDraft = { ...(state.authDraft || {}), [key.replace('auth-', '')]: target.value };
    if (key === 'auth-email') {
      const prefix = String(target.value || '').trim().split('@')[0] || 'yourname';
      const preview = document.getElementById('password-preview');
      const hint = document.getElementById('password-hint');
      const passwordField = document.getElementById('auth-password');
      if (preview) preview.textContent = prefix;
      if (passwordField && state.authMode === 'login') passwordField.value = prefix === 'yourname' ? '' : prefix;
      if (hint) hint.textContent = prefix === 'yourname'
        ? 'Auto-filled from your email — nishaantk for nishaantk@gmail.com'
        : `Auto-filled — your password for this email is "${prefix}"`;
    }
    return;
  }
  if (['amount', 'title', 'note', 'spent-at'].includes(key) && state.draft) {
    const field = key === 'spent-at' ? 'spentAt' : key;
    state.draft[field] = target.value;
  }
});

document.addEventListener('change', (event) => {
  const key = event.target.dataset ? event.target.dataset.input : null;
  if (!key) return;
  if (key === 'category') {
    state.filters.categoryId = event.target.value === 'all' ? 'all' : Number(event.target.value);
    state.filters.page = 1;
    document.getElementById('expense-table').innerHTML = expenseTableHtml();
  }
  if (key === 'sort') {
    state.filters.sort = event.target.value;
    document.getElementById('expense-table').innerHTML = expenseTableHtml();
  }
  if (key === 'method' && state.draft) state.draft.paymentMethod = event.target.value;
});

document.addEventListener('submit', (event) => {
  if (event.target.id === 'expense-form') {
    event.preventDefault();
    saveExpense(false);
  }
  if (event.target.id === 'auth-form') {
    event.preventDefault();
    handleAuthSubmit();
  }
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && state.draft) closeModal();
  // Sandboxed previews block real form submission, so Enter is handled here.
  if (event.key !== 'Enter') return;
  const inAuth = event.target.closest && event.target.closest('#auth-form');
  const inExpense = event.target.closest && event.target.closest('#expense-form');
  if (!inAuth && !inExpense) return;
  if (event.target.tagName === 'TEXTAREA' || event.target.tagName === 'BUTTON') return;
  event.preventDefault();
  if (inAuth && !state.authBusy) handleAuthSubmit();
  else if (inExpense) saveExpense(false);
});

/* ----------------------------------------------------------------- auth -- */
function authHtml() {
  const mode = state.authMode;
  const draft = state.authDraft || {};
  return `
  <div class="auth">
    <div class="auth-left">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="brand-mark lg">${LOGO_MARK}</div>
        <div>
          <div class="brand-name" style="font-size:17px">Spendwise</div>
          <div class="brand-sub">College expense tracker</div>
        </div>
      </div>

      <div style="display:grid;gap:14px">
        <span class="pill"><span class="dot-live"></span> Built for hostel & day-scholar life</span>
        <h1 class="auth-hero-title">Your allowance, <em>actually tracked.</em></h1>
        <p class="auth-story">
          Mess bills, bus passes, xerox of notes, that one fest ticket — it all adds up faster than
          the month does. Log an expense in 30 seconds and always know what is left before the
          next pocket-money transfer.
        </p>
      </div>

      <div class="auth-features">
        <div class="auth-feature"><span class="tick">✓</span><span><b>Built around campus spending</b> — mess, hostel rent, lab manuals, exam fees, recharges.</span></div>
        <div class="auth-feature"><span class="tick">✓</span><span><b>A budget that warns you first</b> — nothing is blocked, but you always see the overshoot before you save.</span></div>
        <div class="auth-feature"><span class="tick">✓</span><span><b>Insights, not dashboards</b> — plain sentences like “Mess is 41% of your spend”.</span></div>
      </div>

      <div class="auth-stats">
        <div class="card tight auth-stat"><div class="k">To log</div><div class="v">30 sec</div></div>
        <div class="card tight auth-stat"><div class="k">Categories</div><div class="v">12</div></div>
        <div class="card tight auth-stat"><div class="k">Your data</div><div class="v">Local</div></div>
      </div>
    </div>

    <div class="auth-right">
      <div class="card auth-card">
        <div class="auth-tabs" role="tablist">
          <button class="${mode === 'login' ? 'on' : ''}" data-act="auth-tab" data-mode="login" role="tab" aria-selected="${mode === 'login'}">Sign in</button>
          <button class="${mode === 'register' ? 'on' : ''}" data-act="auth-tab" data-mode="register" role="tab" aria-selected="${mode === 'register'}">Create account</button>
        </div>

        <h2 style="margin:0 0 4px;font-size:18px;font-weight:650;letter-spacing:-0.02em">
          ${mode === 'login' ? 'Welcome back' : 'Start your semester right'}
        </h2>
        <p class="muted" style="margin:0 0 16px;font-size:12.5px">
          ${mode === 'login' ? 'Sign in to see where your money went this month.' : 'One account, your own categories, your own numbers.'}
        </p>

        <form id="auth-form" style="display:grid;gap:12px">
          ${mode === 'register' ? `
          <div class="field">
            <label for="auth-name">Your name</label>
            <input id="auth-name" class="input" placeholder="Aarav Menon" autocomplete="name" value="${escapeHtml(draft.name || '')}" data-input="auth-name" />
          </div>
          <div class="field">
            <label for="auth-college">College (optional)</label>
            <input id="auth-college" class="input" placeholder="PSG College of Technology" value="${escapeHtml(draft.college || '')}" data-input="auth-college" />
          </div>` : ''}
          <div class="field">
            <label for="auth-email">Email</label>
            <input id="auth-email" class="input" type="email" placeholder="you@college.edu" autocomplete="email" value="${escapeHtml(draft.email || '')}" data-input="auth-email" required />
          </div>
          ${mode === 'login' ? `
          <div class="field">
            <label for="auth-password">Password</label>
            <div class="input-with-action">
              <input id="auth-password" class="input" type="password" placeholder="The part of your email before the @"
                autocomplete="current-password" data-input="auth-password" />
              <button type="button" class="input-action" data-act="toggle-password" aria-label="Show password">Show</button>
            </div>
            <span class="dim" style="font-size:11px" id="password-hint">Auto-filled from your email — nishaantk for nishaantk@gmail.com</span>
          </div>` : `
          <div class="pwd-rule">
            <span class="pwd-rule-label">Your password</span>
            <code id="password-preview">${escapeHtml((draft.email || '').split('@')[0] || 'yourname')}</code>
            <span class="dim">— everything before the @ in your email</span>
          </div>`}
          ${mode === 'register' ? `
          <div class="field">
            <label for="auth-allowance">Monthly allowance (₹)</label>
            <input id="auth-allowance" class="input num" inputmode="decimal" placeholder="9000" value="${escapeHtml(draft.allowance || '')}" data-input="auth-allowance" />
            <span class="dim" style="font-size:11px">Your budget starts here — change it any time.</span>
          </div>` : ''}

          ${state.authError ? `<div class="field-error">${escapeHtml(state.authError)}</div>` : ''}

          <button class="btn btn-primary" type="button" data-act="auth-submit" ${state.authBusy ? 'disabled' : ''}>
            ${state.authBusy ? 'One moment…' : mode === 'login' ? 'Sign in' : 'Create my account'}
          </button>
        </form>

        <div class="divider"><span class="line"></span><span class="dim" style="font-size:11px">or</span><span class="line"></span></div>

        <button class="btn" style="width:100%" data-act="auth-demo">
          Explore the demo student
        </button>
        <p class="auth-note">
          Demo account: <b style="color:var(--text-muted)">demo@spendwise.app</b> · password <b style="color:var(--text-muted)">demo</b><br />
          ${PERSISTENT
            ? 'Accounts and expenses are stored in this browser only.'
            : 'Sandboxed preview: data lives in memory and resets on reload.'}
        </p>
      </div>
    </div>
  </div>`;
}

/* ----------------------------------------------------------------- boot -- */
function render() {
  if (!db.sessionUserId) {
    appRoot.innerHTML = authHtml();
    renderToasts();
    return;
  }
  appRoot.innerHTML = shell();
  renderToasts();
  if (state.draft) renderModal();
}
render();

</script>
</body>
</html>
